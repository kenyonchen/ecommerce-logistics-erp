# RocketMQ 5.3.2 Broker 配置（单 Master 单机版，本地开发）
# 对齐官方文档：https://rocketmq.apache.org/docs/quickStart/02quickstartWithDocker
# 必须包含 brokerIP1；否则 broker 注册 127.0.0.1 给 namesrv，宿主机客户端连不上。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 返回给客户端（宿主机上的 Spring Boot）的地址。
# 端口已映射到宿主机 0.0.0.0:10911，宿主用 127.0.0.1:10911 即可直达容器内 broker。
# 这就是为什么官方示例用 127.0.0.1（host.docker.internal 在宿主机自身并不解析）。
brokerIP1 = 127.0.0.1

# 命名服务地址（容器网络内服务名可达）
namesrvAddr = rmqnamesrv:9876

# 5.x 关闭内置 controller，避免单机无 controller 启动失败
enableControllerInBroker = false

# 开发环境自动建 Topic / 订阅组，省去手动 mqadmin
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 监听端口（与 docker-compose 端口映射一致）
listenPort = 10911
